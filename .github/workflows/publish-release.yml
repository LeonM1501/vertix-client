name: Publish Vertix release
on:
  push:
    branches: [main]
    paths: [version.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download and verify committed release assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          curl --fail --location --retry 5 "$base/version.json" -o version.json
          version="$(jq -r .version version.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
          curl --fail --location --retry 5 "$base/releases/$version/Vertix-Client-Setup.exe" -o Vertix-Client-Setup.exe
          curl --fail --location --retry 5 "$base/releases/$version/Vertix-Client-$version-source.tar.gz" -o "Vertix-Client-$version-source.tar.gz"
          printf '%s  Vertix-Client-Setup.exe\n' "$(jq -r .sha256 version.json)" | sha256sum --check
          printf '%s  Vertix-Client-%s-source.tar.gz\n' "$(jq -r .source_sha256 version.json)" "$version" | sha256sum --check
          jq -r .notes version.json > release-notes.txt
      - name: Publish release with corresponding source
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vertix Client $VERSION" --notes-file release-notes.txt Vertix-Client-Setup.exe "Vertix-Client-$VERSION-source.tar.gz"
